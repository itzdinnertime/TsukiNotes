services:
  postgres:
    image: postgres:16
    container_name: tsukinote_db
    restart: unless-stopped
    # Username and password come from the .env file next to this one (copy .env.example).
    environment:
      POSTGRES_DB: tsukinote
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env (copy .env.example to .env)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example to .env)}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Local "inbox" for development: catches every email the API sends (e.g. password resets)
  # instead of delivering it. Read them at http://localhost:8025. Not for production.
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: tsukinote_mail
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP, used by the API
      - "8025:8025"   # web inbox

volumes:
  pgdata:
